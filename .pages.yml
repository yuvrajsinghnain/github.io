media:
  input: images
  output: /images

content:
  - name: works
    label: Artworks
    type: file
    path: content/works.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Type of artwork
        type: select
        required: true
        options:
          values:
            - name: thread
              label: Thread portrait
            - name: pencil
              label: Microsculpture (pencil tip)
      - name: image
        label: Main photo (shown in the gallery)
        type: image
        required: true
      - name: gallery
        label: More photos (close-ups, other angles)
        type: image
        options:
          multiple:
            max: 12
      - name: details
        label: Short caption (shown under the photo in the gallery)
        type: string
      - name: medium
        label: Medium (e.g. Black thread on white board)
        type: string
      - name: size
        label: Size (e.g. 60 x 60 cm)
        type: string
      - name: year
        label: Year
        type: string
      - name: description
        label: Description (shown on the artwork page)
        type: text

  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: tagline
        label: Small line above the main heading
        type: string
      - name: heading_line1
        label: Main heading, line 1
        type: string
      - name: heading_line2
        label: Main heading, line 2 (gold italic)
        type: string
      - name: intro
        label: Introduction paragraph
        type: text
      - name: hero_video
        label: Home page top video (MP4, loops, no sound)
        type: file
        options:
          extensions: [mp4, webm, mov]
      - name: honours
        label: Achievements strip (number + text)
        type: object
        list: true
        fields:
          - name: number
            label: Big number or word (e.g. 3, 50+)
            type: string
          - name: text
            label: Text under it
            type: string
      - name: records
        label: India Book of Records titles
        type: string
        list: true
      - name: micro_heading
        label: Microsculpture section heading
        type: string
      - name: micro_text
        label: Microsculpture section text
        type: text
      - name: micro_image
        label: Microsculpture section photo
        type: image
      - name: micro_video
        label: Microsculpture section video (MP4, loops)
        type: file
        options:
          extensions: [mp4, webm, mov]
      - name: thread_heading
        label: Thread portrait section heading
        type: string
      - name: thread_text
        label: Thread portrait section text
        type: text
      - name: thread_image
        label: Thread portrait section photo
        type: image
      - name: thread_video
        label: Thread portrait section video (MP4, loops)
        type: file
        options:
          extensions: [mp4, webm, mov]
      - name: contact_heading_1
        label: Contact heading, first part
        type: string
      - name: contact_heading_2
        label: Contact heading, second part (gold italic)
        type: string
      - name: contact_text
        label: Contact paragraph
        type: text
      - name: email
        label: Email address for the Contact button
        type: string
      - name: whatsapp
        label: WhatsApp number with country code (e.g. 919876543210)
        type: string
      - name: instagram
        label: Instagram username or link
        type: string
